name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Slim build: only the GUI extras (no TotalSegmentator/torch), which
        # the PyInstaller spec excludes anyway. Non-editable install is more
        # robust on Windows than `pip install -e`.
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]"
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller pyinstaller.spec --noconfirm

      - name: Smoke test (import graph)
        # Verify the frozen entry point's import graph resolves before we
        # hand the artifact off. Does not require the DICOM fixtures.
        run: python -c "import fatanalyze.gui.app; print('gui import OK')"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BodyFatAnalyzer-build-logs
          path: build/pyinstaller/warn-*.txt
          if-no-files-found: ignore

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BodyFatAnalyzer-Windows-x64
          path: dist/BodyFatAnalyzer/
          if-no-files-found: error

  # Windows 7 / 8 / Server 2008 R2 compat build.
  #
  # CPython 3.9+ links against api-ms-win-core-path-l1-1-0.dll, which does not
  # exist on Windows 7 — the frozen exe fails to start with
  # "missing api-ms-win-core-path-l1-1-0.dll". CPython 3.8 is the last release
  # that still runs on Windows 7, so we build a separate artifact from it.
  # matplotlib 3.9+ also drops Py3.8, hence the <3.9 pin.
  build-windows7:
    name: Build Windows 7 executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (3.8, last Win7-supported)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]"
          pip install "matplotlib<3.9" pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller pyinstaller.spec --noconfirm

      - name: Smoke test (import graph)
        run: python -c "import fatanalyze.gui.app; print('gui import OK')"

      - name: Upload Windows 7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BodyFatAnalyzer-Windows7-x64
          path: dist/BodyFatAnalyzer/
          if-no-files-found: error
